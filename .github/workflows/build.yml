name: Zbuduj APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Budowanie
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Nazwa pliku
        run: cp app/build/outputs/apk/release/app-release.apk MojaTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MojaTV-apk
          path: MojaTV.apk

      # Najnowsza wersja zawsze pod tym samym linkiem:
      # https://github.com/<konto>/<repo>/releases/latest/download/MojaTV.apk
      - name: Wydanie do pobrania na telefon
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MojaTV ${{ github.run_number }}
          body: "Pobierz MojaTV.apk na telefon i zainstaluj."
          files: MojaTV.apk
          make_latest: true
